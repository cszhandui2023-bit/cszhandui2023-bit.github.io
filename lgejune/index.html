<title>LGECH 销售进度 Dashboard · 2026</title>
<style>
:root{--bg:#f4f6fa;--paper:#fff;--surface:#f5f7fa;--ink:#142238;--ink2:#5e6b80;--ink3:#8491a4;--line:#e2e7ef;--accent:#a50034;--pos:#059669;
  --shadow:0 3px 6px rgba(20,34,56,.025),0 14px 32px -22px rgba(20,34,56,.22)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,"PingFang SC","Apple SD Gothic Neo","Malgun Gothic","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;margin:0 auto;padding:24px 24px 0}
.masthead{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:20px 24px;background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.brand{display:flex;gap:16px;align-items:center}
.mark{width:52px;height:52px;background:var(--accent);color:#fff;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;letter-spacing:-.08em;box-shadow:0 8px 18px -9px var(--accent)}
.mark span{font-size:9px;margin:6px 0 0 2px;letter-spacing:0}
.eyebrow{font-size:10px;letter-spacing:.15em;font-weight:800;color:var(--ink3);display:block;margin-bottom:4px}
h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1.25}
h1 span{color:var(--accent)}
.sub{font-size:11px;color:var(--ink2);margin-top:2px}
.sub span{padding-left:10px;color:var(--ink3)}
.status{font-size:11px;border:1px solid var(--line);border-radius:100px;padding:5px 12px;font-weight:700;white-space:nowrap}
.status i{display:inline-block;width:6px;height:6px;background:var(--pos);border-radius:50%;margin-right:7px}
.nav{position:sticky;top:0;z-index:10;margin-top:14px;padding:6px;display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:5px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}
.month-btn{border:0;background:transparent;color:var(--ink2);font:inherit;font-size:13px;font-weight:750;padding:10px 4px;border-radius:9px;cursor:pointer;white-space:nowrap}
.month-btn:hover{background:var(--surface)}
.month-btn.active{background:var(--accent);color:#fff;box-shadow:0 5px 14px -9px var(--accent)}
.month-btn[data-month=Total]{border-left:1px solid var(--line);border-radius:0 9px 9px 0}
.month-btn[data-month=Total].active{border-radius:9px}
.mast-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.cur-group{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.cur-btn{border:0;background:transparent;font:inherit;font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--ink2);padding:5px 14px;border-radius:7px;cursor:pointer}
.cur-btn:hover{color:var(--accent)}
.cur-btn[aria-pressed=true]{background:var(--accent);color:#fff;box-shadow:0 5px 12px -8px var(--accent)}
.fx-note{font-size:10.5px;color:var(--ink3);white-space:nowrap}
.fx-note b{color:var(--ink2);font-weight:700}
iframe{width:100%;min-height:80vh;border:0;display:block;background:transparent}
.foot{max-width:1320px;margin:0 auto;padding:0 24px 28px;color:var(--ink3);font-size:11px;text-align:center}
@media (max-width:760px){.wrap{padding:12px 12px 0}.masthead{padding:14px}.mark{width:40px;height:40px;font-size:17px;border-radius:11px}h1{font-size:18px}.status,.sub span{display:none}.nav{grid-template-columns:repeat(6,1fr);gap:3px;padding:4px}.month-btn{font-size:11px;padding:8px 2px}.month-btn[data-month=Total]{border-left:0;border-radius:9px}}
</style>
</head>

const cache = new Map();
async function unpack(b64){
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const ds = new DecompressionStream('deflate-raw');
  return new TextDecoder().decode(await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer());
}
async function getHtml(m){ if(!cache.has(m)) cache.set(m, await unpack(monthData[m])); return cache.get(m); }

// ---- RMB / USD ----
// 页面原始金额单位是 K元（千元）；USD 模式按当天汇率换算成 K美元（千美元），数量（台）和百分比不动。
const FX_FALLBACK = { rate: 0.14969, date: '2026-10-29', src: '参考汇率' };
let fx = null;
// 每次进入页面默认展示 USD（用户要求：先展示 USD 按钮界面）
let currency = 'USD';
async function loadFx(){
  if (fx) return fx;
  const today = new Date().toISOString().slice(0,10);
  try{
    const c = JSON.parse(localStorage.getItem('lge-fx') || 'null');
    if (c && c.fetched === today) return (fx = c);
  }catch(e){}
  const tries = [
    async () => { const r = await fetch('https://open.er-api.com/v6/latest/CNY'); const d = await r.json();
      return { rate: d.rates.USD, date: new Date(d.time_last_update_unix * 1000).toISOString().slice(0,10), src: 'ExchangeRate-API' }; },
    async () => { const r = await fetch('https://api.frankfurter.dev/v1/latest?base=CNY&symbols=USD'); const d = await r.json();
      return { rate: d.rates.USD, date: d.date, src: 'Frankfurter (ECB)' }; }
  ];
  for (const t of tries){
    try{ const v = await t(); if (v.rate > 0){ v.fetched = today; localStorage.setItem('lge-fx', JSON.stringify(v)); return (fx = v); } }catch(e){}
  }
  return (fx = FX_FALLBACK);
}
const AMOUNT_SCOPES = '.core-combined-module,.product-master,.dept-module-table,.ltv-lite-panel,.customer-module';
const SKIP = 'th,h1,h2,.heat,.tag,.seg-label,.formula-list,.kpi-formula,.subtitle';
const NUM = /[-\u2212]?\d{1,3}(?:,\d{3})+(?:\.\d+)?|[-\u2212]?\d+(?:\.\d+)?/g;
function textNodes(root){ const w = root.ownerDocument.createTreeWalker(root, NodeFilter.SHOW_TEXT); const a = []; let n; while ((n = w.nextNode())) a.push(n); return a; }
function convertDoc(doc, rate){
  doc.querySelectorAll(AMOUNT_SCOPES).forEach(scope => {
    textNodes(scope).forEach(node => {
      const el = node.parentElement;
      if (!el || el.closest(SKIP)) return;
      const txt = node.nodeValue;
      const next = node.nextSibling;
      const unitNext = next && next.nodeType === 1 && /K元/.test(next.textContent);
      const sole = txt.trim();
      node.nodeValue = txt.replace(NUM, (tok, i) => {
        const before = txt[i - 1] || '', after = txt.slice(i + tok.length);
        if (/[\w.\/:-]/.test(before) || /^\s*%/.test(after) || /^[\d.,月日年]/.test(after)) return tok;
        if (tok.includes('.')) return tok;
        if (!(tok.includes(',') || sole === tok || unitNext)) return tok;
        const neg = /^[-\u2212]/.test(tok);
        const v = Math.round(Math.abs(parseFloat(tok.replace(/[-\u2212,]/g, ''))) * rate);
        return (neg && v ? tok[0] : '') + v.toLocaleString('en-US');
      });
    });
  });
  textNodes(doc.body).forEach(n => {
    if (/K元|K위안/.test(n.nodeValue)) n.nodeValue = n.nodeValue.replace(/K元/g, 'K USD').replace(/K위안/g, 'K USD');
  });
}

  const el = document.getElementById('fxNote');
  if (currency !== 'USD' || !fx){ el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = '1 CNY = <b>' + fx.rate.toFixed(4) + '</b> USD · ' + fx.date + ' · ' + fx.src;
}
document.querySelectorAll('.cur-btn').forEach(b => b.addEventListener('click', async () => {
  currency = b.dataset.cur; localStorage.setItem('lge-currency', currency);
  if (currency === 'USD') await loadFx();
  syncCurButtons(); renderFxNote();
  const m = (buttons.find(x => x.classList.contains('active')) || {}).dataset.month || '10月';
  setMonth(m);
}));
function syncCurButtons(){ document.querySelectorAll('.cur-btn').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.cur === currency))); }
frame.addEventListener('load', async () => {
  if (currency === 'USD'){ await loadFx(); try{ convertDoc(frame.contentDocument, fx.rate); }catch(e){ console.error(e); } renderFxNote(); }
  fit();
  try{ new ResizeObserver(fit).observe(frame.contentDocument.body); }catch(e){}
});
window.addEventListener('resize', fit);
async function setMonth(m){
  buttons.forEach(b => b.classList.toggle('active', b.dataset.month === m));
  try{ frame.srcdoc = await getHtml(m); }
  catch(err){ frame.srcdoc = '<p style="padding:28px;color:#d83950;font-family:sans-serif">加载失败: '+String(err&&err.message||err)+'</p>'; }
}
buttons.forEach(b => b.addEventListener('click', () => setMonth(b.dataset.month)));
syncCurButtons();
if (currency === 'USD') loadFx().then(renderFxNote);
setMonth('10月');
</script>
</body>
</html>
