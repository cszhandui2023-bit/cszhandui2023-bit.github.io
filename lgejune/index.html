<!doctype html>
<html lang="zh-CN">
<head>
<meta http-equiv="Cache-Control" content="no-store, must-revalidate">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1~7月销售进度 Dashboard</title>
  <style>
    :root { --bg: #f6f7f4; --paper: #ffffff; --ink: #17201c; --muted: #6d766f; --line: #dce1db; --shadow: 0 10px 28px rgba(31,45,39,.08); }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Microsoft YaHei", Arial, sans-serif; }
    .shell { min-height: 100vh; display: flex; flex-direction: column; }
    .topbar { position: sticky; top: 0; z-index: 10; background: rgba(246,247,244,.96); backdrop-filter: blur(4px); border-bottom: 1px solid var(--line); padding: 14px 18px 12px; display: flex; justify-content: flex-end; gap: 16px; align-items: flex-start; }
    .btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    .month-btn { border: 1px solid var(--line); background: var(--paper); color: var(--muted); border-radius: 999px; padding: 12px 18px; min-width: 64px; font-size: 16px; font-weight: 760; cursor: pointer; box-shadow: 0 2px 8px rgba(20,30,24,.05); }
    .month-btn.active { background: #0f7a64; color: #fff; border-color: #0f7a64; }
    iframe { width: 100%; height: calc(100vh - 82px); border: 0; display: block; background: #fff; }
    .viewer { flex: 1 1 auto; min-height: calc(100vh - 82px); background: #fff; }
    .foot { padding: 8px 18px 14px; color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="btns">
        <button class='month-btn' data-month='1月'>1月</button>
        <button class='month-btn' data-month='2月'>2月</button>
        <button class='month-btn' data-month='3月'>3月</button>
        <button class='month-btn' data-month='4月'>4月</button>
        <button class='month-btn' data-month='5月'>5月</button>
        <button class='month-btn' data-month='6月'>6月</button>
        <button class='month-btn' data-month='7月'>7月</button>
        <button class='month-btn' data-month='8月'>8月</button>
        <button class='month-btn' data-month='9月'>9月</button>
        <button class='month-btn active' data-month='10月'>10月</button>
        <button class='month-btn' data-month='Total'>Total</button>
      </div>
    </div>
    <div class="viewer"><iframe id="frame" title="month dashboard"></iframe></div>
    <div class="foot">1~10 月采用同一版式；Total 为 1~10 月合计视图。</div>
  </div>

        else if (type === 2) {
          var nlen = bits(5) + 257, ndist = bits(5) + 1, ncode = bits(4) + 4;
          if (nlen > 286 || ndist > 30) throw new Error('too many codes');
          var cl = new Uint8Array(19);
          for (var j = 0; j < ncode; j++) cl[order[j]] = bits(3);
          var lencode = build(cl, 19);
          var lengths = new Uint8Array(nlen + ndist);
          var index = 0;
          while (index < nlen + ndist) {
            var sym = decode(lencode);
            if (sym < 16) lengths[index++] = sym;
            else {
              var v = 0, rep = 0;
              if (sym === 16) { if (index === 0) throw new Error('no previous length'); v = lengths[index - 1]; rep = 3 + bits(2); }
              else if (sym === 17) rep = 3 + bits(3);
              else rep = 11 + bits(7);
              if (index + rep > nlen + ndist) throw new Error('too many lengths');
              while (rep--) lengths[index++] = v;
            }
          }
          if (lengths[256] === 0) throw new Error('missing EOB');
          var lc = build(lengths.subarray(0, nlen), nlen);
          var dc = build(lengths.subarray(nlen), ndist);
          codes(lc, dc);
        } else throw new Error('invalid block type');
      } while (!last);
      return out.subarray(0, op);
    }
    async function unpack(bytes) {
      try {
        if (typeof DecompressionStream === 'function') {
          const ds = new DecompressionStream('deflate-raw');
          const buf = await new Response(new Blob([bytes]).stream().pipeThrough(ds)).arrayBuffer();
          return new TextDecoder('utf-8').decode(buf);
        }
      } catch (err) { /* 老浏览器不支持 deflate-raw，走下面纯 JS 兜底 */ }
      return new TextDecoder('utf-8').decode(inflateRawBytes(bytes));
    }
    function waitBox(msg, color) {
      return '<div style="padding:28px;font:15px/1.6 -apple-system,sans-serif;color:' + color + '">' + msg + '</div>';
    }
    async function getHtml(month) {
      if (cache.has(month)) return cache.get(month);
      let bytes;
      if (monthData[month]) {
        bytes = Uint8Array.from(atob(monthData[month]), ch => ch.charCodeAt(0));
      } else {
        const res = await fetch(dataFile[month]);
        if (!res.ok) throw new Error('分片加载失败 ' + dataFile[month] + ' (' + res.status + ')');
        bytes = new Uint8Array(await res.arrayBuffer());
      }
      const html = await unpack(bytes);
      cache.set(month, html);
      return html;
    }
    async function setMonth(month) {
      if (!cache.has(month)) frame.srcdoc = waitBox('불러오는 중… 加载中', '#6d766f');
      try {
        frame.srcdoc = await getHtml(month);
      } catch (err) {
        frame.srcdoc = waitBox('페이지 로드 실패 加载失败: ' + String((err && err.message) || err), '#c0392b');
      }
      buttons.forEach(btn => btn.classList.toggle('active', btn.dataset.month === month));
    }
    buttons.forEach(btn => btn.addEventListener('click', () => setMonth(btn.dataset.month)));

    // 首屏渲染完成后后台预取其余月份（空闲时逐个拉取并解压进 cache），
    // 这样点其它 tab 时基本是秒开；失败静默忽略，切 tab 时会重新按需拉取。
    async function prefetchRest() {
      const keys = Object.keys(dataFile || {});
      const order = ['Total'].concat(keys.filter(k => k !== 'Total'));
      for (const m of order) {
        if (cache.has(m) || (monthData && monthData[m])) continue;
        try { await getHtml(m); } catch (err) { /* 忽略，切 tab 时重试 */ }
        await new Promise(r => setTimeout(r, 30));
      }
    }
    function boot() {
      setMonth('10月');
      const kick = () => prefetchRest();
      if (typeof requestIdleCallback === 'function') requestIdleCallback(kick, { timeout: 3000 });
      else setTimeout(kick, 1200);
    }
    boot();
  </script>
</body>
</html>
