<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중국 냉장고 · 세탁기 · AVC 시장슬롯</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Microsoft YaHei",sans-serif; }
  body { display:flex; flex-direction:column; background:#fff; }
  .tabbar { display:flex; gap:6px; padding:6px 10px; background:#fff; border-bottom:2px solid #A50034; }
  .tab { cursor:pointer; border:1px solid #d5d8de; background:#fff; color:#333;
         padding:7px 20px; border-radius:8px 8px 0 0; font-size:13px; font-weight:700; transition:all .12s ease; }
  .tab:hover { background:#f6e8ee; }
  .tab.active { background:#A50034; color:#fff; border-color:#A50034; }
  .stage { flex:1; position:relative; }
  .pane { position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; }
</style>
</head>
<body>
  <div class="tabbar">
    <button id="tab-ref" class="tab active" onclick="showTab('ref')">🧊 냉장고 Refrigerator</button>
    <button id="tab-wm" class="tab" onclick="showTab('wm')">🌀 세탁기 Washing Machine</button>
  </div>
  <div class="stage">
    <iframe id="frame-ref" class="pane" style="display:block" src="refrigerator.html"></iframe>
    <iframe id="frame-wm" class="pane" style="display:none" data-src="washing-machine.html"></iframe>
  </div>
<script>
  function loadPane(key){
    var f = document.getElementById('frame-'+key);
    if(!f) return;
    if(!f.getAttribute('src')){
      var s = f.getAttribute('data-src');
      if(s) f.setAttribute('src', s);
    }
  }
  function showTab(key){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.pane').forEach(f=>f.style.display='none');
    loadPane(key);
    document.getElementById('frame-'+key).style.display='block';
    document.getElementById('tab-'+key).classList.add('active');
    if(history.replaceState) history.replaceState(null,'','#tab='+key);
  }
  (function(){
    var k=(location.hash.match(/tab=(\w+)/)||[])[1];
    if(k && document.getElementById('frame-'+k)) showTab(k);
  })();
  // 첫 화면이 다 뜬 뒤 남은 탭을 idle 타임에 미리 받아두기 (체감 지연 없이 전환 즉시)
  window.addEventListener('load', function(){
    var idle = window.requestIdleCallback || function(cb){ setTimeout(cb, 1500); };
    idle(function(){
      document.querySelectorAll('.pane').forEach(function(f){
        if(!f.getAttribute('src')){
          var s = f.getAttribute('data-src');
          if(s) f.setAttribute('src', s);
        }
      });
    });
  });
</script>
</body>
</html>
